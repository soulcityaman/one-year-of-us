<style>
:root{
  --bg:#050505; --paper:#090909; --paper2:#0d0d0d; --ink:#f2ede5; --muted:#9c948b;
  --cream:#efe6d7; --red:#d33a47; --red-soft:#8f2530; --line:rgba(255,255,255,.11);
  --ease:cubic-bezier(.2,.82,.2,1); --shadow:rgba(0,0,0,.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 38%,#6b1b2b 0%,#46101d 34%,#260812 70%,#120307 100%);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
body{display:grid;place-items:center;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
button{font:inherit}
.app{width:min(100%,840px);height:100%;display:grid;place-items:center}
.stage{position:relative;width:min(100%,760px);height:min(96dvh,940px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;perspective:2400px}
.book-shell{position:relative;width:min(92vw,410px);height:min(79dvh,745px);min-height:520px}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d;filter:drop-shadow(0 28px 36px rgba(0,0,0,.7))}
.book::before{content:"";position:absolute;inset:1% 1.5% 1% 3.4%;background:#1a050b;border:1px solid rgba(255,220,220,.08);border-radius:8px;transform:translateZ(-24px);box-shadow:inset -6px 0 0 #020202,0 26px 40px rgba(0,0,0,.42)}
.page{position:absolute;inset:0 0 0 5.2%;overflow:hidden;border-radius:4px 12px 12px 4px;background:
  radial-gradient(circle at 20% 20%,rgba(255,255,255,.035),transparent 35%),
  radial-gradient(circle at 85% 75%,rgba(255,255,255,.025),transparent 34%),
  linear-gradient(90deg,rgba(255,255,255,.025),transparent 7%,transparent 96%,rgba(255,255,255,.02)),
  #10070a;
  color:var(--ink); box-shadow:inset 0 0 0 1px rgba(255,255,255,.065), inset 12px 0 28px rgba(0,0,0,.55), 10px 18px 30px rgba(0,0,0,.38);
  transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;z-index:10;
  transition:transform .78s var(--ease),filter .78s var(--ease),box-shadow .78s var(--ease);
  will-change:transform,filter
}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.12) .45px,transparent .58px);background-size:4px 4px;opacity:.13;mix-blend-mode:screen}
.page::after{content:"";position:absolute;left:0;top:0;bottom:0;width:13px;background:linear-gradient(90deg,rgba(0,0,0,.65),transparent);pointer-events:none;opacity:.75}
.page.flipping.next-flip{transform:rotateY(-168deg);filter:brightness(.72)}
.page.flipping.prev-flip{transform:rotateY(168deg);filter:brightness(.72)}
.spine{position:absolute;left:-2%;top:2%;bottom:2%;width:10.5%;z-index:30;display:flex;flex-direction:column;justify-content:space-around;pointer-events:none;transform:translate3d(0,0,0)}
.ring{width:112%;height:28px;border:4px solid #161616;border-right-color:#6d6d6d;border-radius:50%;transform:rotate(-10deg);transform-origin:50% 50%;box-shadow:2px 2px 3px rgba(0,0,0,.75),inset 1px 1px 0 rgba(255,255,255,.2);will-change:transform,filter}
.spine.turn-next{animation:spineShiftNext .78s var(--ease) both}
.spine.turn-prev{animation:spineShiftPrev .78s var(--ease) both}
.spine.turn-next .ring,.spine.turn-prev .ring{animation:coilFlex .78s var(--ease) both}
.spine.turn-next .ring:nth-child(3n+1){animation-delay:-.08s}
.spine.turn-next .ring:nth-child(3n+2){animation-delay:-.03s}
.spine.turn-prev .ring:nth-child(3n+1){animation-delay:-.08s}
.spine.turn-prev .ring:nth-child(3n+2){animation-delay:-.03s}
@keyframes spineShiftNext{0%,100%{transform:translateX(0)}32%{transform:translateX(4px) rotate(1deg)}58%{transform:translateX(6px) rotate(0deg)}82%{transform:translateX(2px)}}
@keyframes spineShiftPrev{0%,100%{transform:translateX(0)}32%{transform:translateX(-4px) rotate(-1deg)}58%{transform:translateX(-6px) rotate(0deg)}82%{transform:translateX(-2px)}}
@keyframes coilFlex{0%{transform:rotate(-10deg) scaleX(1);filter:brightness(1)}28%{transform:rotate(-8deg) scaleX(.82);filter:brightness(1.22)}54%{transform:rotate(-12deg) scaleX(1.12);filter:brightness(.9)}78%{transform:rotate(-9deg) scaleX(.96);filter:brightness(1.04)}100%{transform:rotate(-10deg) scaleX(1);filter:brightness(1)}}
.page-content{position:absolute;inset:0;padding:9.5% 9% 10.5%;display:flex;flex-direction:column;overflow:hidden}
.eyebrow{font-family:Arial,sans-serif;font-size:7px;letter-spacing:.27em;font-weight:700;color:#d5c8ba;text-transform:uppercase;opacity:.78}
h1,h2,h3,p{margin:0}.display{font-family:Impact,'Arial Narrow',Arial,sans-serif;letter-spacing:.015em;text-transform:uppercase;line-height:.86}.hand{font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive}.serif{font-family:Georgia,serif}.small{font-size:9px;line-height:1.5;color:#b8afa6}
.red{color:var(--red)}
.page-no{position:absolute;left:9%;bottom:4.5%;font:7px Arial,sans-serif;letter-spacing:.18em;color:#6f6963;text-transform:uppercase}
.edge-doodle{position:absolute;color:rgba(211,58,71,.72);font-family:'Segoe Print',cursive;font-size:19px;transform:rotate(-10deg)}
.cover{background:#070607;overflow:hidden}

.cover-photo-field::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 25%,transparent 72%,rgba(0,0,0,.28));z-index:8;pointer-events:none}
.cover-shot{position:absolute;padding:4px;background:#ddd4c8;box-shadow:0 16px 32px rgba(0,0,0,.62);transform-origin:center;overflow:hidden}

.cover-shot span{display:none}
.cover-shot.a{left:-3%;top:-3%;width:56%;height:39%;transform:rotate(-4deg);z-index:2}
.cover-shot.b{right:-4%;top:-2%;width:51%;height:35%;transform:rotate(3.5deg);z-index:3}
.cover-shot.c{left:-2%;top:31%;width:48%;height:37%;transform:rotate(2.4deg);z-index:4}

.cover-title-lockup h1 strong{display:inline;padding:0;background:none;box-shadow:none;transform:rotate(-1deg)}
.cover .cover-vignette{position:absolute;inset:0;z-index:10;pointer-events:none;box-shadow:inset 0 0 80px rgba(0,0,0,.58)}
.hero .photo-wrap{position:relative;margin:7% 4% 5%;height:48%;padding:7px 7px 30px;background:#ece4d8;transform:rotate(-2.4deg);box-shadow:0 12px 20px rgba(0,0,0,.45);color:#2a2521}.hero .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(.94) saturate(.92)}.hero .caption{position:absolute;bottom:7px;left:0;right:0;text-align:center;font:9px 'Segoe Print',cursive;color:#584e46}.hero h2{font-size:33px;margin:2% 0 4%;white-space:pre-line}.hero .body{font-size:10px;line-height:1.62;color:#bab1a8;max-width:94%}.scribble{position:absolute;right:7%;bottom:7%;font-size:12px;color:#cf6570;transform:rotate(-7deg)}
.words h2,.reasons h2,.notification h2,.memory h2,.youare h2,.letter h2,.eats h2,.openwhen h2,.birthday h2,.people h2,.finale h2{font-size:30px;margin:5% 0 5%}.words h2{max-width:92%}.note-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4%;z-index:2}.note{padding:11px 10px;background:#e9dfd0;color:#231e1b;border-radius:2px;font-size:10px;min-height:50px;display:flex;align-items:center;box-shadow:4px 5px 0 rgba(255,255,255,.03),0 8px 18px rgba(0,0,0,.35);transform:rotate(var(--r));position:relative}.note:nth-child(2n){background:#d7bfc1}.note:nth-child(3n){background:#d6d0ba}.big-doodle{font-size:130px;color:#9e2430;opacity:.14;position:absolute;right:-4%;bottom:-9%;transform:rotate(-18deg)}
.reason-list{display:flex;flex-direction:column;gap:7px;margin-top:2%;z-index:2}.reason{font-size:9.5px;line-height:1.4;padding:8px 9px 8px 28px;background:#101010;border:1px solid #2a2a2a;position:relative;box-shadow:4px 5px 0 rgba(255,255,255,.02)}.reason::before{content:'♥';position:absolute;left:10px;top:8px;color:var(--red);font-size:9px}.reason-photo{position:absolute;width:33%;height:25%;right:5%;bottom:7%;padding:6px;background:#e8ded0;transform:rotate(5deg);box-shadow:0 10px 18px rgba(0,0,0,.45)}.reason-photo img{width:100%;height:100%;object-fit:cover}
.collage{position:relative}.collage-canvas{position:relative;height:61%;margin-top:3%;flex:1;min-height:0}.clip-photo{position:absolute;background:#efe6d7;padding:7px 7px 24px;box-shadow:0 13px 20px rgba(0,0,0,.58);color:#2a2521}.clip-photo img{width:100%;height:100%;object-fit:cover;display:block}.clip-photo span{position:absolute;bottom:4px;left:6px;right:6px;text-align:center;font:7px 'Segoe Print',cursive;color:#554a42}.clip-photo.tape::before{content:"";position:absolute;top:-8px;left:28%;width:44%;height:17px;background:rgba(230,218,197,.72);transform:rotate(-2deg);z-index:3}.collage .c1{left:0;top:8%;width:58%;height:67%;transform:rotate(-4deg)}.collage .c2{right:2%;top:0;width:42%;height:51%;transform:rotate(4.5deg);z-index:2}.collage .c3{right:10%;bottom:5%;width:47%;height:48%;transform:rotate(-2.2deg);z-index:3}.collage .c4{left:10%;bottom:0;width:43%;height:35%;transform:rotate(3deg);z-index:4}.collage .caption{font:9px 'Segoe Print',cursive;color:#a99f96;margin-top:5px;text-align:center;z-index:5}

  pageEl.querySelectorAll('.envelope').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();b.classList.toggle('open')}));

function go(dir){if(busy)return;const target=(pageIndex+dir+SCRAPBOOK.length)%SCRAPBOOK.length;busy=true;const turnClass=dir>0?'turn-next':'turn-prev';spine.classList.remove('turn-next','turn-prev');void spine.offsetWidth;spine.classList.add(turnClass);pageEl.classList.remove('next-flip','prev-flip');pageEl.classList.add('flipping',dir>0?'next-flip':'prev-flip');setTimeout(()=>{pageIndex=target;renderPage(SCRAPBOOK[pageIndex]);pageEl.classList.remove('flipping','next-flip','prev-flip');busy=false},420);setTimeout(()=>spine.classList.remove(turnClass),820)}
$('next').addEventListener('click',()=>go(1));$('prev').addEventListener('click',()=>go(-1));
pageEl.addEventListener('contextmenu',e=>{e.preventDefault();if(!e.target.closest('button'))go(1)});
pageEl.addEventListener('click',e=>{if(e.target.closest('button'))return;go(-1)});
let sx=0,sy=0;book.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.15)go(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(modal.classList.contains('open'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
function formatTime(t){if(!Number.isFinite(t))return'0:00';const m=Math.floor(t/60),s=Math.floor(t%60);return `${m}:${String(s).padStart(2,'0')}`}
function parseLrc(lines){const re=/\[(\d{2}):(\d{2}(?:\.\d{1,3})?)\]/g,out=[];for(const raw of(lines||[])){let ms=[],m;while((m=re.exec(raw)))ms.push(Number(m[1])*60+Number(m[2]));const text=raw.replace(re,'').trim();if(ms.length)ms.forEach(t=>out.push({time:t,text}));else if(text)out.push({time:null,text})}return out.sort((a,b)=>(a.time??1e9)-(b.time??1e9))}
function getLyrics(t){let l=t.lyrics||[];return l.length&&typeof l[0]==='string'?parseLrc(l):l}
const COVER_POOL=Array.from({length:40},(_,i)=>`photos/photo-${String(i+1).padStart(2,'0')}.jpg`);
const coverOrder=[...COVER_POOL].sort(()=>Math.random()-0.5);
const refreshCovers=PLAYLIST.map((_,i)=>coverOrder[i%COVER_POOL.length]);
function loadTrack(i,autoplay=false){trackIndex=(i+PLAYLIST.length)%PLAYLIST.length;const t=PLAYLIST[trackIndex];const cover=refreshCovers[trackIndex]||t.cover;audio.src='assets/'+t.src;miniArt.src='assets/'+cover;fullArt.src='assets/'+cover;miniTitle.textContent=t.title;miniArtist.textContent=t.artist;fullTitle.textContent=t.title;fullArtist.textContent=t.artist;renderLyrics();renderQueue();audio.load();if(autoplay)audio.play().catch(()=>toast('Tap play to start the music'))}
function renderLyrics(){lyrics.innerHTML='';const ls=getLyrics(PLAYLIST[trackIndex]);if(!ls.length){lyrics.innerHTML='<div class="lyric">Add lyrics in the PLAYLIST data ♡</div>';return}ls.forEach((x,i)=>{const d=document.createElement('div');d.className='lyric';d.textContent=x.text||'';d.dataset.i=i;if(typeof x.time==='number'){d.dataset.time=x.time;d.addEventListener('click',e=>{e.stopPropagation();audio.currentTime=x.time})}lyrics.appendChild(d)})}
function renderQueue(){queue.innerHTML='';PLAYLIST.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='track-pill';b.textContent=t.title;b.addEventListener('click',e=>{e.stopPropagation();loadTrack(i,true)});queue.appendChild(b)})}
let lastLyric=-1;function syncLyrics(){const nodes=[...lyrics.querySelectorAll('.lyric')];let active=-1;const time=audio.currentTime;nodes.forEach((n,i)=>{const t=Number(n.dataset.time);if(Number.isFinite(t)&&t<=time)active=i});nodes.forEach((n,i)=>n.classList.toggle('active',i===active));if(active>=0&&active!==lastLyric&&nodes[active]){nodes[active].scrollIntoView({block:'center',behavior:'smooth'});lastLyric=active}}
function updatePlayer(){const pct=audio.duration?audio.currentTime/audio.duration*100:0;seekFill.style.width=pct+'%';miniFill.style.width=pct+'%';curTime.textContent=formatTime(audio.currentTime);durTime.textContent=formatTime(audio.duration);syncLyrics();const playing=!audio.paused;miniPlay.textContent=playing?'❚❚':'▶';fullPlay.textContent=playing?'❚❚':'▶';fullArt.style.transform=playing?'scale(1.012)':'scale(1)'}
function togglePlay(){if(audio.paused)audio.play().catch(()=>toast('Tap play again to allow audio'));else audio.pause()}
miniPlayer.addEventListener('click',()=>{modal.classList.add('open');modal.setAttribute('aria-hidden','false');renderLyrics()});miniPlay.addEventListener('click',e=>{e.stopPropagation();togglePlay()});fullPlay.addEventListener('click',togglePlay);$('prevSong').addEventListener('click',()=>loadTrack(trackIndex-1,true));$('nextSong').addEventListener('click',()=>loadTrack(trackIndex+1,true));$('closePlayer').addEventListener('click',()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true')});modal.addEventListener('click',e=>{if(e.target===modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}});seek.addEventListener('click',e=>{if(!audio.duration)return;const r=seek.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration});audio.addEventListener('timeupdate',updatePlayer);audio.addEventListener('loadedmetadata',updatePlayer);audio.addEventListener('play',updatePlayer);audio.addEventListener('pause',updatePlayer);audio.addEventListener('ended',()=>loadTrack(trackIndex+1,true));
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1800)}
renderPage(SCRAPBOOK[0]);loadTrack(0,false);
</script>
</body></html>
